# Starts PostgreSQL, the API and the website:  docker compose up --build
# Copy .env.example to .env (project root) first.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-lumora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on your machine, so it never clashes with a local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumora} -d ${POSTGRES_DB:-lumora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database host is "postgres". Use a password without special characters (@ : / #).
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumora}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-lumora}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
